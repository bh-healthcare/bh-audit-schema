name: Validate Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "jsonschema[format]" pytest

      - name: Validate examples against schema (positive + negative corpora)
        run: python scripts/validate_examples.py

      - name: Run test suite
        run: pytest tests/ -v
